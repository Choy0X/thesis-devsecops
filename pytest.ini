[pytest]
testpaths = tests
addopts = -ra
filterwarnings =
    ignore::DeprecationWarning
markers =
    network: needs outbound network access (runs only with ZTSA_TEST_NETWORK=1)
    tokenizer: needs the pinned Qwen tokenizer files (runs only with ZTSA_TEST_TOKENIZER=1)
    docker: needs a running Docker daemon
    mongo: legacy marker for repository storage tests, now using isolated embedded files
    mongo_migration: optional source integration needing a reachable MongoDB migration source
    gpu: needs a CUDA device
    slow: long-running test (runs only with ZTSA_TEST_SLOW=1)
